<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="12" height="12" viewBox="0 0 12 12">
  <style>
    use:not(:target) {
      display: none;
    }
    use {
      stroke: #fff;
      opacity: 0.8;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    use[id^="open"] {
      opacity: 1;
    }
    use[id*="-hover"],
    use[id*="-focus"] {
      stroke: #b9adff;
      opacity: 1;
    }
  </style>
  <defs>
    <path id="clsd-shape" d="M4.5 2.5 8 6 4.5 9.5"/>
    <path id="open-shape" d="M2.5 4.5 6 8 9.5 4.5"/>
    <path id="clsd-rtl-shape" d="M7.5 2.5 4 6 7.5 9.5"/>
    <path id="open-rtl-shape" d="M9.5 4.5 6 8 2.5 4.5"/>
  </defs>
  <use id="clsd" xlink:href="#clsd-shape"/>
  <use id="clsd-hover" xlink:href="#clsd-shape"/>
  <use id="open" xlink:href="#open-shape"/>
  <use id="open-hover" xlink:href="#open-shape"/>
  <use id="clsd-rtl" xlink:href="#clsd-shape"/>
  <use id="clsd-hover-rtl" xlink:href="#clsd-shape"/>
  <use id="open-rtl" xlink:href="#open-shape"/>
  <use id="open-hover-rtl" xlink:href="#open-shape"/>
  <use id="clsd-focus" xlink:href="#clsd-shape"/>
  <use id="clsd-focus-rtl" xlink:href="#clsd-shape"/>
  <use id="open-focus" xlink:href="#open-shape"/>
  <use id="open-focus-rtl" xlink:href="#open-shape"/>
</svg>
