<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     x="0" y="0" width="14" height="16" viewBox="0 0 14 16">
  <style>
    use:not(:target) {
      display: none;
    }
    use {
      fill: none;
      stroke: #fff;
      stroke-width: 1.2;
      stroke-linejoin: round;
    }
    use[id="active"] {
      stroke: #00AEFF;
    }
    use[id="darktext"] {
      stroke: #000;
    }
  </style>
  <defs>
    <g id="alltabs-shape">
      <rect x="1.6" y="3" width="4.8" height="4.8" rx="1"/>
      <rect x="7.6" y="3" width="4.8" height="4.8" rx="1"/>
      <rect x="1.6" y="8.8" width="4.8" height="4.8" rx="1"/>
      <rect x="7.6" y="8.8" width="4.8" height="4.8" rx="1"/>
    </g>
  </defs>
  <use id="alltabs" xlink:href="#alltabs-shape"/>
  <use id="active" xlink:href="#alltabs-shape"/>
  <use id="darktext" xlink:href="#alltabs-shape"/>
</svg>
